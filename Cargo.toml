[workspace]
resolver = "3"
members = ["crates/studio-core", "crates/studio-rules", "crates/studio-editor", "crates/robot-studio"]

[workspace.package]
version = "0.23.0-rc.1"
edition = "2024"

[workspace.dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu"] }
glam = "0.30"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.18"
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
ureq = { version = "3.2", features = ["json"] }
url = "2"
wgpu = { version = "27.0.1", default-features = false, features = ["dx12", "vulkan", "wgsl"] }
